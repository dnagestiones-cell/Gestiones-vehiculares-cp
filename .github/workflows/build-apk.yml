name: Construir APK Punto 4

on:
  workflow_dispatch:
  push:
    branches:
      - principal

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Descomprimir proyecto
        run: unzip -q GestionesVehiculares_APK_Punto4_GananciaGestiones.zip

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Dar permisos a Gradle
        run: chmod +x GestionesAPK/gradlew

      - name: Compilar APK
        working-directory: GestionesAPK
        run: ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: GestionesVehiculares-Punto4
          path: GestionesAPK/app/build/outputs/apk/debug/app-debug.apk
